<svg xmlns="http://www.w3.org/2000/svg" class="ei-chart" width="720" height="430" viewBox="0 0 720 430" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Rast prihodkov, ki jo vključuje cena pred in po padcu, v primerjavi z dosedanjo rastjo in pričakovanji analitikov">
<style>
  .ei-chart {
    --ei-surface: var(--color-surface, #FCFAF5);
    --ei-border: var(--color-border, #D8D3C5);
    --ei-grid: var(--color-border, #E6E2D6);
    --ei-axis: var(--color-border-strong, #BDB7A8);
    --ei-ink: var(--color-text, #1A1A1A);
    --ei-muted: var(--color-text-muted, #6B6B6B);
    --ei-rise: var(--chart-rise, #2a78d6);
    --ei-fall: var(--chart-fall, #e34948);
    --ei-a: var(--chart-rise, #2a78d6);
    --ei-b: var(--chart-vlozki, #0d9488);
    --ei-c: var(--chart-obresti, #c4531d);
    --ei-benchmark: var(--color-text-muted, #6B6B6B);
  }
  @media (prefers-color-scheme: dark) {
    .ei-chart {
    --ei-surface: var(--color-surface, #181818);
    --ei-border: var(--color-border, #2A2A2A);
    --ei-grid: var(--color-border, #232323);
    --ei-axis: var(--color-border-strong, #3A3A3A);
    --ei-ink: var(--color-text, #F0F0EE);
    --ei-muted: var(--color-text-muted, #888888);
      --ei-benchmark: var(--color-text-muted, #888888);
    }
  }
</style>
<rect x="0.5" y="0.5" width="719" height="429" rx="10" style="fill:var(--ei-surface);stroke:var(--ei-border)"/>
<text x="24" y="38" font-size="19" font-weight="600" style="fill:var(--ei-ink)">Po padcu cena pričakuje manj rasti</text>
<text x="24" y="62" font-size="13.5" style="fill:var(--ei-muted)">Rast prihodkov na leto. Cena: povprečje prvih petih let pri zahtevanem donosu 9 % in nespremenjeni marži</text>
<line x1="250" x2="250" y1="104" y2="344" style="stroke:var(--ei-axis)" stroke-width="1"/><text x="250" y="362" font-size="11" text-anchor="middle" style="fill:var(--ei-muted)">0 %</text><line x1="380" x2="380" y1="104" y2="344" style="stroke:var(--ei-grid)" stroke-width="1"/><text x="380" y="362" font-size="11" text-anchor="middle" style="fill:var(--ei-muted)">10 %</text><line x1="510" x2="510" y1="104" y2="344" style="stroke:var(--ei-grid)" stroke-width="1"/><text x="510" y="362" font-size="11" text-anchor="middle" style="fill:var(--ei-muted)">20 %</text><line x1="640" x2="640" y1="104" y2="344" style="stroke:var(--ei-grid)" stroke-width="1"/><text x="640" y="362" font-size="11" text-anchor="middle" style="fill:var(--ei-muted)">30 %</text><text x="238" y="129" font-size="12.5" text-anchor="end" style="fill:var(--ei-ink)">Rast 2021 do 2025, na leto</text><rect x="250" y="114" width="153.4" height="22" rx="3" style="fill:var(--ei-muted)"/><text x="411.4" y="129" font-size="12.5" font-weight="600" style="fill:var(--ei-ink);font-variant-numeric:tabular-nums">11,8 %</text><text x="238" y="169" font-size="12.5" text-anchor="end" style="fill:var(--ei-ink)">Zadnjih 12 mesecev</text><rect x="250" y="154" width="288.6" height="22" rx="3" style="fill:var(--ei-muted)"/><text x="546.6" y="169" font-size="12.5" font-weight="600" style="fill:var(--ei-ink);font-variant-numeric:tabular-nums">22,2 %</text><text x="238" y="209" font-size="12.5" text-anchor="end" style="fill:var(--ei-ink)">Analitiki za 2026</text><rect x="250" y="194" width="310.7" height="22" rx="3" style="fill:var(--ei-b)"/><text x="568.7" y="209" font-size="12.5" font-weight="600" style="fill:var(--ei-ink);font-variant-numeric:tabular-nums">23,9 %</text><text x="238" y="249" font-size="12.5" text-anchor="end" style="fill:var(--ei-ink)">Analitiki za 2027</text><rect x="250" y="234" width="351" height="22" rx="3" style="fill:var(--ei-b)"/><text x="609" y="249" font-size="12.5" font-weight="600" style="fill:var(--ei-ink);font-variant-numeric:tabular-nums">27,0 %</text><text x="238" y="289" font-size="12.5" text-anchor="end" style="fill:var(--ei-ink)">Cena pred objavo (324,89 USD)</text><rect x="250" y="274" width="224.9" height="22" rx="3" style="fill:var(--ei-a)"/><text x="482.9" y="289" font-size="12.5" font-weight="600" style="fill:var(--ei-ink);font-variant-numeric:tabular-nums">17,3 %</text><text x="238" y="329" font-size="12.5" text-anchor="end" style="fill:var(--ei-ink)">Cena po padcu (283,82 USD)</text><rect x="250" y="314" width="185.9" height="22" rx="3" style="fill:var(--ei-a)"/><text x="443.9" y="329" font-size="12.5" font-weight="600" style="fill:var(--ei-ink);font-variant-numeric:tabular-nums">14,3 %</text>
<text x="24" y="400" font-size="11.5" style="fill:var(--ei-muted)">Vir: Alphabet (10-K, sporočila o rezultatih), S&amp;P Global prek stockanalysis.com (29. 10. 2026), Yahoo Finance.</text><text x="24" y="418" font-size="11.5" style="fill:var(--ei-muted)">Obratni DCF: izračun Engineering Investor (ROIC 31,6 %, dolgoročna rast 2,5 %).</text>
