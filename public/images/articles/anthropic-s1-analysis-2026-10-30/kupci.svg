<svg xmlns="http://www.w3.org/2000/svg" class="ei-chart" width="720" height="430" viewBox="0 0 720 430" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Number of Anthropic customers spending at least $100,000 a year, Q4 2024 to Q3 2026">
