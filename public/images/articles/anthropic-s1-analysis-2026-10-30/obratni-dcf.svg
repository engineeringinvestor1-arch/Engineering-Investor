-ink)">Alphabet today (last four quarters)</text><rect x="268" y="246" width="165.8" height="22" rx="3" style="fill:var(--ei-b)"/><text x="441.8" y="261" font-size="12.5" font-weight="600" style="fill:var(--ei-ink);font-variant-numeric:tabular-nums">471</text>
