<svg xmlns="http://www.w3.org/2000/svg" class="ei-chart" width="720" height="370" viewBox="0 0 720 370" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Revenue implied for 2036 by valuations of $1,000bn and $2,000bn, compared with Anthropic and Alphabet revenue today">
<style>
