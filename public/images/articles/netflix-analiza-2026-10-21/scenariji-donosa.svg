<text x="24" y="86" font-size="12.5" style="fill:var(--ei-muted)">Navpično: predpostavljena rast dobička na delnico. Vodoravno: razmerje cena/dobiček čez pet let.</text><text x="279.4" y="104" font-size="12.5" text-anchor="middle" style="fill:var(--ei-muted)">P/E 15</text><text x="446" y="104" font-size="12.5" text-anchor="middle" style="fill:var(--ei-muted)">P/E 20</text><text x="612.8" y="104" font-size="12.5" text-anchor="middle" style="fill:var(--ei-muted)">P/E 25</text><text x="182" y="144.8" font-size="12.5" text-anchor="end" style="fill:var(--ei-ink)">rast dobička 8 % na leto</text><rect x="198" y="118" width="162.7" height="43.5" rx="6" style="fill:var(--ei-a);opacity:0.08"/><text x="279.4" y="145.8" font-size="16" text-anchor="middle" font-weight="600" style="fill:var(--ei-ink);font-variant-numeric:tabular-nums">−0,1 %</text><rect x="364.7" y="118" width="162.7" height="43.5" rx="6" style="fill:var(--ei-a);opacity:0.27"/><text x="446" y="145.8" font-size="16" text-anchor="middle" font-weight="600" style="fill:var(--ei-ink);font-variant-numeric:tabular-nums">+5,8 %</text><rect x="531.4" y="118" width="162.7" height="43.5" rx="6" style="fill:var(--ei-a);opacity:0.44"/><text x="612.8" y="145.8" font-size="16" text-anchor="middle" font-weight="600" style="fill:var(--ei-ink);font-variant-numeric:tabular-nums">+10,6 %</text><text x="182" y="192.3" font-size="12.5" text-anchor="end" style="fill:var(--ei-ink)">rast dobička 12 % na leto</text><rect x="198" y="165.5" width="162.7" height="43.5" rx="6" style="fill:var(--ei-a);opacity:0.20"/><text x="279.4" y="193.3" font-size="16" text-anchor="middle" font-weight="600" style="fill:var(--ei-ink);font-variant-numeric:tabular-nums">+3,6 %</text><rect x="364.7" y="165.5" width="162.7" height="43.5" rx="6" style="fill:var(--ei-a);opacity:0.41"/><text x="446" y="193.3" font-size="16" text-anchor="middle" font-weight="600" style="fill:var(--ei-ink);font-variant-numeric:tabular-nums">+9,7 %</text><rect x="531.4" y="165.5" width="162.7" height="43.5" rx="6" style="fill:var(--ei-a);opacity:0.57"/><text x="612.8" y="193.3" font-size="16" text-anchor="middle" font-weight="600" style="fill:var(--ei-ink);font-variant-numeric:tabular-nums">+14,7 %</text><text x="182" y="239.8" font-size="12.5" text-anchor="end" style="fill:var(--ei-ink)">rast dobička 16 % na leto</text><rect x="198" y="213" width="162.7" height="43.5" rx="6" style="fill:var(--ei-a);opacity:0.33"/><text x="279.4" y="240.8" font-size="16" text-anchor="middle" font-weight="600" style="fill:var(--ei-ink);font-variant-numeric:tabular-nums">+7,3 %</text><rect x="364.7" y="213" width="162.7" height="43.5" rx="6" style="fill:var(--ei-a);opacity:0.54"/><text x="446" y="240.8" font-size="16" text-anchor="middle" font-weight="600" style="fill:var(--ei-ink);font-variant-numeric:tabular-nums">+13,6 %</text><rect x="531.4" y="213" width="162.7" height="43.5" rx="6" style="fill:var(--ei-a);opacity:0.71"/><text x="612.8" y="240.8" font-size="16" text-anchor="middle" font-weight="600" style="fill:#fff;font-variant-numeric:tabular-nums">+18,8 %</text><text x="182" y="287.3" font-size="12.5" text-anchor="end" style="fill:var(--ei-ink)">rast dobička 20 % na leto</text><rect x="198" y="260.5" width="162.7" height="43.5" rx="6" style="fill:var(--ei-a);opacity:0.45"/><text x="279.4" y="288.3" font-size="16" text-anchor="middle" font-weight="600" style="fill:var(--ei-ink);font-variant-numeric:tabular-nums">+11,0 %</text><rect x="364.7" y="260.5" width="162.7" height="43.5" rx="6" style="fill:var(--ei-a);opacity:0.67"/><text x="446" y="288.3" font-size="16" text-anchor="middle" font-weight="600" style="fill:#fff;font-variant-numeric:tabular-nums">+17,6 %</text><rect x="531.4" y="260.5" width="162.7" height="43.5" rx="6" style="fill:var(--ei-a);opacity:0.85"/><text x="612.8" y="288.3" font-size="16" text-anchor="middle" font-weight="600" style="fill:#fff;font-variant-numeric:tabular-nums">+22,9 %</text>
<text x="24" y="342" font-size="11.5" style="fill:var(--ei-muted)">Ponazoritev, ne napoved. Brez dividend. Izhodišče je dobiček na delnico za 2026 (2,90 USD v devetih mesecih in napoved</text><text x="24" y="360" font-size="11.5" style="fill:var(--ei-muted)">0,67 USD za četrto četrtletje), zmanjšan za enkratni učinek odstopnine (približno 0,47 USD). Izračun: Engineering Investor.</text><text x="24" y="378" font-size="11.5" style="fill:var(--ei-muted)">Cena: Yahoo Finance, zaprtje 20. 10. 2026. Vir dobička: pismo delničarjem 20. 10. 2026.</text>
