</style>
<rect x="0.5" y="0.5" width="719" height="389" rx="10" style="fill:var(--ei-surface);stroke:var(--ei-border)"/>
<text x="24" y="38" font-size="19" font-weight="600" style="fill:var(--ei-ink)">Kaj mora držati, da se nakup pri tej ceni izide</text>
