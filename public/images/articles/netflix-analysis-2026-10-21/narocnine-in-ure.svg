ei-ink);font-variant-numeric:tabular-nums">+7.7%</text><text x="650" y="308.2" font-size="11.5" text-anchor="middle" style="fill:var(--ei-ink);font-variant-numeric:tabular-nums">+1.5%</text><text x="570" y="370" font-size="11" text-anchor="middle" style="fill:var(--ei-muted)">memberships</text><text x="650" y="370" font-size="11" text-anchor="middle" style="fill:var(--ei-muted)">viewing hours</text>
<text x="24" y="410" font-size="11.5" style="fill:var(--ei-muted)">Source: Netflix, 10-K annual reports for 2023 and 2024 (memberships to 2024); shareholder letters of 20 Jan 2026</text><text x="24" y="428" font-size="11.5" style="fill:var(--ei-muted)">(more than 325 million memberships) and 16 Jul 2026 (viewing hours growth in 2025). Exact 2025 figure not published.</text>
