<svg xmlns="http://www.w3.org/2000/svg" class="ei-chart" width="720" height="440" viewBox="0 0 720 440" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Netflix paid memberships at year end from 2021 to 2025 and growth in memberships and viewing hours in 2025">
<style>
  .ei-chart {
    --ei-surface: var(--color-surface, #FCFAF5);
    --ei-border: var(--color-border, #D8D3C5);
    --ei-grid: var(--color-border, #E6E2D6);
    --ei-axis: var(--color-border-strong, #BDB7A8);
    --ei-ink: var(--color-text, #1A1A1A);
    --ei-muted: var(--color-text-muted, #6B6B6B);
