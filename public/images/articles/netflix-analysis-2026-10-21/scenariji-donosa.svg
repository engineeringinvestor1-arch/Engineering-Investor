<svg xmlns="http://www.w3.org/2000/svg" class="ei-chart" width="720" height="390" viewBox="0 0 720 390" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Table of annual returns under different assumptions for earnings growth and the price/earnings ratio in five years">
<style>
  .ei-chart {
