<svg xmlns="http://www.w3.org/2000/svg" class="ei-chart" width="720" height="470" viewBox="0 0 720 470" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Rast prihodkov, ki jo vključuje cena pred objavo, v primerjavi z dosedanjo rastjo in pričakovanji analitikov">
<style>
  .ei-chart {
    --ei-surface: var(--color-surface, #FCFAF5);
    --ei-border: var(--color-border, #D8D3C5);
    --ei-grid: var(--color-border, #E6E2D6);
    --ei-axis: var(--color-border-strong, #BDB7A8);
    --ei-ink: var(--color-text, #1A1A1A);
    --ei-muted: var(--color-text-muted, #6B6B6B);
    --ei-rise: var(--chart-rise, #2a78d6);
    --ei-fall: var(--chart-fall, #e34948);
    --ei-a: var(--chart-rise, #2a78d6);
    --ei-b: var(--chart-vlozki, #0d9488);
    --ei-c: var(--chart-obresti, #c4531d);
    --ei-benchmark: var(--color-text-muted, #6B6B6B);
  }
  @media (prefers-color-scheme: dark) {
    .ei-chart {
    --ei-surface: var(--color-surface, #181818);
    --ei-border: var(--color-border, #2A2A2A);
    --ei-grid: var(--color-border, #232323);
    --ei-axis: var(--color-border-strong, #3A3A3A);
    --ei-ink: var(--color-text, #F0F0EE);
    --ei-muted: var(--color-text-muted, #888888);
      --ei-benchmark: var(--color-text-muted, #888888);
    }
  }
</style>
<rect x="0.5" y="0.5" width="719" height="469" rx="10" style="fill:var(--ei-surface);stroke:var(--ei-border)"/>
<text x="24" y="38" font-size="19" font-weight="600" style="fill:var(--ei-ink)">Cena pričakuje počasnejšo rast od dosedanje</text>
<text x="24" y="62" font-size="13.5" style="fill:var(--ei-muted)">Rast na leto; pri ceni: prihodki naslednjih deset let pri zahtevanem donosu 10 % in enaki marži</text>
