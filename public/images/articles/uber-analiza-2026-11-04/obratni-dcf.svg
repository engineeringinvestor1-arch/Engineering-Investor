<text x="24" y="440" font-size="11.5" style="fill:var(--ei-muted)">Vir: Uber (10-K, sporočila o rezultatih), S&amp;P Global prek stockanalysis.com (4. 11. 2026), Yahoo Finance (66,60 USD, 3. 11. 2026).</text><text x="24" y="458" font-size="11.5" style="fill:var(--ei-muted)">Obratni DCF: izračun Engineering Investor (ROIC 28 %, po desetih letih spust na 2,5 % v petih letih).</text>
